# Local stack aligned with future GKE: staff zone vs portal zone; shared Postgres only.
# Portal containers cannot reach CouchDB/Redis (they are on lahim_staff only).
# Core API and portal API communicate on lahim_core_bridge.
#
# Boot-first core workflow:
#   cp .env.docker.example .env.docker
#   ./scripts/docker-build-native.sh lahim-server
#   ./scripts/docker-up-native.sh postgres redis couchdb lahim-server
#   ./scripts/verify-core-baseline.sh
#   ./scripts/docker-build-native.sh staff-frontend
#   ./scripts/docker-up-native.sh staff-frontend
#
# Easier local debugging:
#   npm install
#   cp .env.docker.example .env.docker
#   cp .env.debug.example .env.debug
#   npm run debug:infra
#   npm run debug:server
#   npm run debug:frontend

services:
  couchdb:
    image: couchdb:3
    environment:
      - COUCHDB_USER=dev
      - COUCHDB_PASSWORD=dev
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://dev:dev@localhost:5984/"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - lahim_staff

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=lahim
      - POSTGRES_PASSWORD=lahim_dev
      - POSTGRES_DB=lahim
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lahim"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - lahim_staff
      - lahim_portal

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - lahim_staff

  lahim-server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      IP: 0.0.0.0
      COUCHDB_URL: http://dev:dev@couchdb:5984
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgresql://lahim:lahim_dev@postgres:5432/lahim
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      PATIENT_PORTAL_API_URL: http://patient-portal-server:4001
      PORTAL_SERVICE_TOKEN: ${PORTAL_SERVICE_TOKEN:-dev-portal-service-token}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http=require('http');const timeout=setTimeout(()=>process.exit(1),5000);http.get('http://127.0.0.1:3000/health',res=>{clearTimeout(timeout);process.exit(res.statusCode===200?0:1)}).on('error',()=>{clearTimeout(timeout);process.exit(1)})"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      couchdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lahim_staff
      - lahim_core_bridge

  staff-frontend:
    build:
      context: .
      dockerfile: docker/staff-frontend/Dockerfile
      args:
        VITE_LAHIM_API: ${VITE_LAHIM_API:-http://localhost:3000}
        VITE_HOSPITALRUN_API: ${VITE_HOSPITALRUN_API:-http://localhost:3000}
    ports:
      - "3001:80"
    depends_on:
      lahim-server:
        condition: service_healthy
    networks:
      - lahim_staff

  patient-portal-server:
    build:
      context: .
      dockerfile: docker/patient-portal-server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4001"
      PORTAL_DATABASE_URL: postgresql://lahim:lahim_dev@postgres:5432/patient_portal
      PATIENT_PORTAL_JWT_SECRET: ${PATIENT_PORTAL_JWT_SECRET:-dev-patient-portal-jwt-secret}
      PORTAL_SERVICE_TOKEN: ${PORTAL_SERVICE_TOKEN:-dev-portal-service-token}
      PATIENT_PORTAL_FRONTEND_URL: ${PATIENT_PORTAL_FRONTEND_URL:-http://localhost:4002}
      LAHIM_CORE_API_URL: http://lahim-server:3000
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      lahim-server:
        condition: service_started
    networks:
      - lahim_portal
      - lahim_core_bridge

  patient-portal-frontend:
    build:
      context: .
      dockerfile: docker/patient-portal-frontend/Dockerfile
      args:
        VITE_PORTAL_API_URL: ${VITE_PORTAL_API_URL:-http://localhost:4001}
    ports:
      - "4002:80"
    depends_on:
      - patient-portal-server
    networks:
      - lahim_portal

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - lahim_staff

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - lahim_staff

volumes:
  couchdb-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  lahim_staff:
    driver: bridge
  lahim_portal:
    driver: bridge
  lahim_core_bridge:
    driver: bridge
