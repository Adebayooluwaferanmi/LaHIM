global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'lahim'
    environment: 'development'

scrape_configs:
  - job_name: 'lahim-server'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'lahim-server'
          instance: 'lahim-server-1'

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['host.docker.internal:9187']
        labels:
          service: 'postgres'
          instance: 'postgres-1'

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['host.docker.internal:9121']
        labels:
          service: 'redis'
          instance: 'redis-1'

