name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build components package
        working-directory: packages/components-lahim
        run: yarn build

      - name: Build frontend
        working-directory: packages/frontend
        env:
          VITE_HOSPITALRUN_API: ${{ secrets.VITE_HOSPITALRUN_API || 'http://localhost:3000' }}
          VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH || '/' }}
        run: yarn build

      - name: Create lahim.io directory and copy build output
        run: |
          rm -rf lahim.io
          mkdir -p lahim.io
          cp -r packages/frontend/build/* lahim.io/

      - name: Copy index.html to 404.html for SPA routing
        working-directory: lahim.io
        run: cp index.html 404.html

      - name: Create .nojekyll file
        run: touch lahim.io/.nojekyll

      - name: Ensure CNAME file exists
        run: |
          if [ ! -f lahim.io/CNAME ]; then
            echo "lahim.io" > lahim.io/CNAME
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lahim.io

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

